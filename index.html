<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Kalkulators</h1>
    <input type="number" name="num1" id="num1" placeholder="1.Skaitlis" />
    <input type="text" name="operator" id="operator" placeholder="Operātors" />
    <input type="number" name="num2" id="num2" placeholder="2.Skaitlis" />
    <button id="btnclear">Notīrīt</button>
    <button id="btn">Rēķināt</button><br />
    <p id="output"></p>

    <script>
      const btn = document.querySelector("#btn");
      const btnclear = document.querySelector("#btnclear");
      const firstNumberInput = document.getElementById("num1");
      const operatorInput = document.getElementById("operator");
      const secondNumberInput = document.getElementById("num2");
      const outputContainer = document.getElementById("output");

      btn.addEventListener("click", handleClick);
      btnclear.addEventListener("click", handleClear);
      function handleClick() {
        let firstNumberValue = parseFloat(firstNumberInput.value);
        let secondNumberValue = parseFloat(secondNumberInput.value);
        let operatorValue = operatorInput.value;
        let result;

        switch (operatorValue) {
          case "+":
            result = firstNumberValue + secondNumberValue;
            break;

          case "-":
            result = firstNumberValue - secondNumberValue;
            break;

          case "/":
            result = firstNumberValue / secondNumberValue;
            break;

          case "*":
            result = firstNumberValue * secondNumberValue;
            break;

          default:
            console.log("nederīgs operātors");
            return;
        }

        outputContainer.innerText = `Rezultāts: ${result}`;
      }
      function handleClear() {
        outputContainer.innerText = "";
      }
    </script>
  </body>
</html>
